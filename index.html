<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depois Não Reclama | Central de Produção</title>
<style>
:root{--pink:#d81b60;--pink2:#f06292;--ink:#211d22;--cream:#fff8f2;--muted:#756c73;--line:#eadfe4;--card:#fff;--green:#2e7d5b;--yellow:#fff0bd}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f3f5;color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:245px;background:#211d22;color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:21px;line-height:1.05}.brand small{display:block;color:#eeb0c8;font-size:11px;margin-top:7px;letter-spacing:.12em;text-transform:uppercase}.nav{margin-top:38px}.nav button{width:100%;text-align:left;background:none;border:0;color:#d9d2d6;padding:12px 13px;border-radius:10px;cursor:pointer;font-size:14px;margin:2px 0}.nav button.active,.nav button:hover{background:#3b3037;color:#fff}.nav button.active{border-left:3px solid var(--pink2)}.main{flex:1;padding:28px 34px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--pink);font-weight:800}.title{font-size:34px;font-weight:900;margin:5px 0}.sub{color:var(--muted);font-size:14px}.btn{border:0;border-radius:10px;background:var(--pink);color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #32151d08}.stat b{font-size:30px;display:block}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.task input{accent-color:var(--pink)}.next{background:linear-gradient(135deg,#2a2227,#4a2c39);color:#fff;border-radius:16px;padding:22px}.next .muted{color:#d7cbd0}.empty{color:var(--muted);padding:25px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:12px}.filter.active{background:var(--pink);color:#fff;border-color:var(--pink)}.search{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sketch h3{margin:0 0 9px;font-size:15px}.meta{font-size:12px;color:var(--muted);margin:4px 0}.badge{display:inline-block;font-size:11px;border-radius:999px;padding:5px 8px;background:#f2ecef;margin-top:7px}.review{background:var(--yellow)}.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.person{text-align:center}.avatar{width:56px;height:56px;border-radius:50%;background:#f6d5e2;color:#9e1648;display:grid;place-items:center;margin:0 auto 9px;font-weight:900}.person b{font-size:13px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eee8eb;border-radius:14px;padding:12px;min-height:230px}.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:4px 5px 12px}.item{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px;font-size:13px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.notice{padding:13px 15px;border-radius:10px;background:#fce8ef;color:#7f173e;font-size:13px;margin-bottom:15px}@media(max-width:900px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.two,.cards,.kanban{grid-template-columns:1fr}.cast{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{position:relative;width:100%;height:auto}.nav{display:flex;overflow:auto;margin-top:18px}.nav button{white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:1fr 1fr}.title{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">DEPOIS<br>NÃO RECLAMA<small>Arcana Produções Artísticas</small></div>
<div class="nav" id="nav"></div>
</aside>
<main class="main" id="main"></main>
</div>
<script>
const DATA = {"elenco": ["Lucas Oliver", "Diogo Adriani", "Lantieri Muniz", "Nathália Medeiros", "Kiohara"], "esquetes": [["A chamada do seminário. (Padre)", "Lantieri", "Disponível", ""], ["Kelly Pix (garota de programa)", "Lantieri", "Disponível", ""], ["Sapashow.", "Lantieri", "Disponível", ""], ["Elsa (Frozen)", "Lantieri", "Disponível", "★ Em avaliação do diretor"], ["Iemanjá está de saco cheio", "Lantieri", "Disponível", ""], ["Marlene a cozinheira", "Lantieri", "Disponível", ""], ["Solo Bela e a Fera", "Lantieri", "Disponível", "★ Em avaliação do diretor"], ["A Patricinha", "Kiohara", "Disponível", ""], ["Bárbara de Mont’Claire (rica)", "Lucas", "Inédita", ""], ["Olga Olegário (jornalista)", "Lucas", "Inédita", ""], ["Dona Quermelinda", "Lucas", "Inédita", ""], ["Pietra Prosperina (coach)", "Lucas", "Inédita", ""], ["Jaqueline PowerFit (influenciadora fitness)", "Lucas", "Inédita", ""], ["Marluce do RH", "Lucas", "Inédita", ""], ["Lurdinha do Universitário (fofoqueira)", "Lucas", "Inédita", ""], ["A Secretária de Consultório", "Lucas", "Inédita", ""], ["Selena da Silva (política)", "Lucas", "Inédita", ""], ["Mística Mirtes (astróloga)", "Lucas", "Inédita", ""], ["Grace Kelly do Peixoto (manicure)", "Lucas", "Inédita", ""], ["Guadalupe Rodrigues (professora)", "Lucas", "Inédita", ""], ["Sharon Glitter (drag)", "Lucas", "Inédita", ""], ["Hérnia de Disco (drag)", "Lucas", "Inédita", ""], ["Mirelly (atendente)", "Lucas", "Inédita", ""], ["Véronique Vicentini (diretora de teatro)", "Lucas", "Inédita", ""], ["Melindra Morangueira (cantora de bar)", "Lucas", "Inédita", ""], ["Princesas (3 esquetes)", "Lucas", "Atualizada/Já apresentada", ""], ["As fofoqueiras", "Lucas", "Atualizada/Já apresentada", ""], ["Blogueiras (2025)", "Lucas", "Atualizada/Já apresentada", ""], ["Casos de Família (2025)", "Lucas", "Atualizada/Já apresentada", ""], ["As Velhinhas/Milho aos Pombos (Diolinda e Albertina)", "Lucas", "Atualizada/Já apresentada", ""], ["Cabaré da Dalva", "Lucas", "Atualizada/Já apresentada", ""], ["Casal Ostentação", "Lucas", "Atualizada/Já apresentada", ""], ["Comissários de Bordo", "Lucas", "Atualizada/Já apresentada", "★ Em avaliação do diretor"], ["Nova Rica", "Lucas", "Atualizada/Já apresentada", "★ Em avaliação do diretor"], ["Family Famous", "Lucas", "Atualizada/Já apresentada", ""], ["Jantar com Jon Snow", "Lucas", "Atualizada/Já apresentada", ""], ["Jornal feito em Casa", "Lucas", "Atualizada/Já apresentada", ""]]};
const key='dnr-central-v1';
let state=JSON.parse(localStorage.getItem(key)||'null')||{tasks:["Definir repertório","Definir personagens","Montar calendário de ensaios","Definir figurinos","Definir adereços"],done:[],selected:[]};
let page='inicio', filter='Todas', query='';
const save=()=>localStorage.setItem(key,JSON.stringify(state));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const navItems=[['inicio','Início'],['elenco','Elenco'],['esquetes','Banco de Esquetes'],['espetaculo','Espetáculo'],['ensaios','Ensaios'],['producao','Produção'],['divulgacao','Divulgação'],['orcamento','Orçamento']];
function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}
function shell(title,sub,body){document.querySelector('#main').innerHTML=`<div class="top"><div><div class="eyebrow">Central de Produção</div><div class="title">${title}</div><div class="sub">${sub}</div></div><button class="btn" onclick="go('esquetes')">Banco de esquetes</button></div>${body}`}
function go(p){page=p;renderNav();render()}
function render(){
 if(page==='inicio') return home();
 if(page==='elenco') return elenco();
 if(page==='esquetes') return esquetes();
 if(page==='espetaculo') return espetaculo();
 if(page==='ensaios') return generic('Ensaios','Calendário e acompanhamento dos ensaios',`<div class="notice">O calendário está pronto para receber datas, horários, locais, elenco convocado e esquetes de cada ensaio.</div><div class="empty">Nenhum ensaio cadastrado ainda.</div>`);
 if(page==='producao') return producao();
 if(page==='divulgacao') return generic('Divulgação','Planejamento de comunicação',`<div class="kanban"><div class="col"><h3>A fazer</h3><div class="item">Lançamento do cartaz</div><div class="item">Apresentação das personagens</div></div><div class="col"><h3>Em andamento</h3><div class="item">Identidade visual</div></div><div class="col"><h3>Concluído</h3><div class="item">Conceito visual</div></div></div>`);
 return generic('Orçamento','Controle financeiro da montagem',`<div class="empty">Nenhum valor lançado ainda. A estrutura financeira pode ser preenchida quando os custos forem definidos.</div>`);
}
function home(){
 const reviews=DATA.esquetes.filter(x=>x[3]).length;
 shell('Depois Não Reclama','Um espetáculo de esquetes humorísticas · Arcana Produções Artísticas',
 `<div class="grid"><div class="stat"><b>${DATA.elenco.length}</b><span>Elenco confirmado</span></div><div class="stat"><b>${DATA.esquetes.length}</b><span>Esquetes no banco</span></div><div class="stat"><b>${reviews}</b><span>Em avaliação</span></div><div class="stat"><b>0</b><span>Esquetes selecionadas</span></div></div>
 <div class="section two"><div class="card"><h2>Próximas decisões</h2>${state.tasks.map((t,i)=>`<label class="task"><input type="checkbox" ${state.done.includes(i)?'checked':''} onchange="toggleTask(${i})"> ${esc(t)}</label>`).join('')}</div><div class="next"><div class="eyebrow" style="color:#f5a7c2">Próximo ensaio</div><h2>A definir</h2><div class="muted">Data · horário · local</div><hr style="border:0;border-top:1px solid #ffffff20;margin:20px 0"><div class="muted">Produção em fase de organização.</div></div></div>
 <div class="section"><h2>Elenco confirmado</h2><div class="cast">${DATA.elenco.map(n=>`<div class="card person"><div class="avatar">${n.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><b>${esc(n)}</b></div>`).join('')}</div></div>`);
}
function toggleTask(i){state.done=state.done.includes(i)?state.done.filter(x=>x!==i):[...state.done,i];save();render()}
function elenco(){shell('Elenco','5 integrantes confirmados · distribuição de personagens ainda não definida',`<div class="cast">${DATA.elenco.map(n=>`<div class="card person"><div class="avatar">${n.split(' ').map(x=>x[0]).slice(0,2).join('')}</div><b>${esc(n)}</b><div class="meta">Personagens: a definir</div><div class="meta">Esquetes: a definir</div></div>`).join('')}</div><div class="section card"><h2>Regra atual</h2><div class="sub">As esquetes estão no banco de repertório. Nenhuma foi vinculada a um ator para a montagem final.</div></div>`)}
function esquetes(){
 let arr=DATA.esquetes.filter(x=>(filter==='Todas'||(filter==='Inéditas'&&x[2]==='Inédita')||(filter==='Já apresentadas'&&x[2].includes('Já'))||(filter==='Em avaliação'&&x[3]))&&x[0].toLowerCase().includes(query.toLowerCase()));
 shell('Banco de Esquetes',`${DATA.esquetes.length} opções de repertório`,`
 <input class="search" placeholder="Buscar esquete..." value="${esc(query)}" oninput="query=this.value;render()">
 <div class="filters">${['Todas','Inéditas','Já apresentadas','Em avaliação'].map(f=>`<button class="filter ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div>
 <div class="cards">${arr.map((x,i)=>`<div class="card sketch"><h3>${esc(x[0])}</h3><div class="meta">Origem: ${esc(x[1])}</div><span class="badge">${esc(x[2])}</span>${x[3]?`<div class="badge review">${esc(x[3])}</div>`:''}<div style="margin-top:12px"><button class="filter" onclick="toggleSelect('${encodeURIComponent(x[0])}')">${state.selected.includes(x[0])?'✓ Selecionada':'Selecionar'}</button></div></div>`).join('')}</div>`);
}
function toggleSelect(name){name=decodeURIComponent(name);if(state.selected.includes(name))state.selected=state.selected.filter(x=>x!==name);else state.selected.push(name);save();render()}
function espetaculo(){shell('Espetáculo','Repertório efetivamente selecionado para a montagem',state.selected.length?`<div class="notice">${state.selected.length} esquete(s) selecionada(s). A ordem ainda pode ser definida.</div><div class="cards">${state.selected.map((x,i)=>`<div class="card sketch"><h3>${String(i+1).padStart(2,'0')} · ${esc(x)}</h3><div class="meta">Personagens, duração e necessidades técnicas: a definir.</div></div>`).join('')}</div>`:`<div class="empty">Nenhuma esquete foi selecionada ainda. Vá ao Banco de Esquetes e use “Selecionar” para montar o repertório.</div>`)}
function producao(){shell('Produção','Acompanhamento das tarefas da montagem',`<div class="kanban"><div class="col"><h3>A fazer</h3><div class="item">Definir teatro</div><div class="item">Definir cenário</div><div class="item">Comprar adereços</div></div><div class="col"><h3>Em andamento</h3><div class="item">Seleção das esquetes</div><div class="item">Identidade visual</div></div><div class="col"><h3>Concluído</h3><div class="item">Elenco confirmado</div><div class="item">Banco de repertório</div></div></div>`)}
function generic(t,s,b){shell(t,s,b)}
renderNav();render();
</script>
</body></html>
