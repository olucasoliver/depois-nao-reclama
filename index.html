<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Depois Não Reclama | Central de Produção</title>
<style>
:root{--pink:#d81b60;--pink2:#f06292;--ink:#211d22;--cream:#fff8f2;--muted:#756c73;--line:#eadfe4;--card:#fff;--green:#2e7d5b;--yellow:#fff0bd}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f3f5;color:var(--ink)}
.app{display:flex;min-height:100vh}.side{width:245px;background:#211d22;color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:21px;line-height:1.05}.brand small{display:block;color:#eeb0c8;font-size:11px;margin-top:7px;letter-spacing:.12em;text-transform:uppercase}.nav{margin-top:38px}.nav button{width:100%;text-align:left;background:none;border:0;color:#d9d2d6;padding:12px 13px;border-radius:10px;cursor:pointer;font-size:14px;margin:2px 0}.nav button.active,.nav button:hover{background:#3b3037;color:#fff}.nav button.active{border-left:3px solid var(--pink2)}.main{flex:1;padding:28px 34px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--pink);font-weight:800}.title{font-size:34px;font-weight:900;margin:5px 0}.sub{color:var(--muted);font-size:14px}.btn{border:0;border-radius:10px;background:var(--pink);color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px #32151d08}.stat b{font-size:30px;display:block}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.task input{accent-color:var(--pink)}.next{background:linear-gradient(135deg,#2a2227,#4a2c39);color:#fff;border-radius:16px;padding:22px}.next .muted{color:#d7cbd0}.empty{color:var(--muted);padding:25px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;cursor:pointer;font-size:12px}.filter.active{background:var(--pink);color:#fff;border-color:var(--pink)}.search{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sketch h3{margin:0 0 9px;font-size:15px}.meta{font-size:12px;color:var(--muted);margin:4px 0}.badge{display:inline-block;font-size:11px;border-radius:999px;padding:5px 8px;background:#f2ecef;margin-top:7px}.review{background:var(--yellow)}.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.person{text-align:center}.avatar{width:56px;height:56px;border-radius:50%;background:#f6d5e2;color:#9e1648;display:grid;place-items:center;margin:0 auto 9px;font-weight:900}.person b{font-size:13px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eee8eb;border-radius:14px;padding:12px;min-height:230px}.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:4px 5px 12px}.item{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px;font-size:13px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.notice{padding:13px 15px;border-radius:10px;background:#fce8ef;color:#7f173e;font-size:13px;margin-bottom:15px}@media(max-width:900px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.two,.cards,.kanban{grid-template-columns:1fr}.cast{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{position:relative;width:100%;height:auto}.nav{display:flex;overflow:auto;margin-top:18px}.nav button{white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:1fr 1fr}.title{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">DEPOIS<br>NÃO RECLAMA<small>Arcana Produções Artísticas</small></div>
<div class="nav" id="nav"></div>
</aside>
<main class="main" id="main"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://tatcgvmdozofxhxribdn.supabase.co';
const SUPABASE_KEY='sb_publishable_Q_OSMySEc1JZaLf5kxGsZA_31mfCKas';
const sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let DB={elenco:[],esquetes:[],ensaios:[],tarefas:[],perfil:null,funcoes:[],perfilFuncoes:[],perfis:[]},page='inicio',filter='Todas',query='',user=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const navItems=[['inicio','Início'],['elenco','Elenco'],['esquetes','Banco de Esquetes'],['espetaculo','Espetáculo'],['ensaios','Ensaios'],['producao','Produção'],['divulgacao','Divulgação'],['orcamento','Orçamento'],['equipe','Equipe e Acessos']];
function nav(){document.querySelector('#nav').innerHTML=navItems.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function go(p){page=p;nav();render()}
function shell(t,s,b){document.querySelector('#main').innerHTML='<div class="top"><div><div class="eyebrow">Central de Produção</div><div class="title">'+t+'</div><div class="sub">'+s+'</div></div><button class="btn" onclick="go(\'esquetes\')">Banco de esquetes</button></div>'+b}
async function load(){const a=await Promise.all([sbClient.from('elenco').select('*').eq('ativo',true).order('nome'),sbClient.from('esquetes').select('*').order('numero'),sbClient.from('ensaios').select('*').order('data_hora',{ascending:true}),sbClient.from('tarefas_producao').select('*').order('created_at')]);DB.elenco=a[0].data||[];DB.esquetes=a[1].data||[];DB.ensaios=a[2].data||[];DB.tarefas=a[3].data||[];const s=await sbClient.auth.getSession();user=s.data.session?s.data.session.user:null;DB.perfil=null;DB.funcoes=[];DB.perfilFuncoes=[];DB.perfis=[];if(user){let p=await sbClient.from('perfis').select('*').eq('id',user.id).maybeSingle();if(!p.data&&!p.error){await sbClient.rpc('solicitar_acesso');p=await sbClient.from('perfis').select('*').eq('id',user.id).maybeSingle()}DB.perfil=p.data||null;const f=await sbClient.from('funcoes').select('*').eq('ativo',true).order('nome');DB.funcoes=f.data||[];const pf=await sbClient.from('perfil_funcoes').select('perfil_id,funcao_id,principal');DB.perfilFuncoes=pf.data||[];if(temFuncao('Diretor')){const ps=await sbClient.from('perfis').select('*').order('created_at');DB.perfis=ps.data||[]}}render()}
function render(){if(page==='inicio')return home();if(page==='elenco')return elenco();if(page==='esquetes')return esquetes();if(page==='espetaculo')return espetaculo();if(page==='ensaios')return ensaios();if(page==='producao')return producao();if(page==='equipe')return equipe();if(page==='divulgacao')return generic('Divulgação','Planejamento de comunicação','<div class="notice">Módulo preparado para calendário de posts, responsáveis, canais e status.</div>');return generic('Orçamento','Controle financeiro da montagem','<div class="empty">Módulo financeiro preparado para receber os lançamentos da produção.</div>')}
function temFuncao(nome){if(!user)return false;const f=DB.funcoes.find(x=>x.nome===nome);return !!f&&DB.perfilFuncoes.some(x=>x.perfil_id===user.id&&x.funcao_id===f.id)}
function podeEditar(){return !!user && (temFuncao('Diretor')||temFuncao('Produção')||['diretor','producao'].includes(DB.perfil?.papel))}
function podeSelecionar(){return !!user && (temFuncao('Diretor')||DB.perfil?.papel==='diretor')}
function podeGerenciarEquipe(){return !!user && (temFuncao('Diretor')||DB.perfil?.papel==='diretor')}
function home(){const reviews=DB.esquetes.filter(x=>x.selecao==='Em avaliação do diretor').length,selected=DB.esquetes.filter(x=>x.selecao==='Selecionada').length,next=DB.ensaios[0];shell('Depois Não Reclama','Um espetáculo de esquetes humorísticas · Arcana Produções Artísticas','<div class="grid"><div class="stat"><b>'+DB.elenco.length+'</b><span>Elenco confirmado</span></div><div class="stat"><b>'+DB.esquetes.length+'</b><span>Esquetes no banco</span></div><div class="stat"><b>'+reviews+'</b><span>Em avaliação</span></div><div class="stat"><b>'+selected+'</b><span>Esquetes selecionadas</span></div></div><div class="section two"><div class="card"><h2>Próximas decisões</h2><div class="task">Definir repertório</div><div class="task">Definir calendário de ensaios</div><div class="task">Definir figurinos e adereços</div></div><div class="next"><div class="eyebrow" style="color:#f5a7c2">Próximo ensaio</div><h2>'+esc(next?next.titulo:'A definir')+'</h2><div class="muted">'+(next&&next.data_hora?new Date(next.data_hora).toLocaleString('pt-BR'):'Data · horário · local')+'</div><hr style="border:0;border-top:1px solid #ffffff20;margin:20px 0"><div class="muted">'+(user?'Sessão conectada':'Modo consulta. Faça login para editar dados.')+'</div></div></div><div class="section"><h2>Elenco confirmado</h2><div class="cast">'+DB.elenco.map(n=>'<div class="card person"><div class="avatar">'+esc(n.nome.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</div><b>'+esc(n.nome)+'</b></div>').join('')+'</div></div><div class="section card"><h2>Acesso</h2>'+(user?'<div class="sub">Conectado como '+esc(user.email||'usuário')+(DB.perfil?' · Perfil: '+esc(DB.perfil.papel):'')+'</div><button class="filter" onclick="logout()">Sair</button>':'<div class="sub">Para editar o sistema, faça login.</div><button class="btn" onclick="login()">Entrar</button>')+'</div>')}
function elenco(){shell('Elenco','5 integrantes confirmados · distribuição de personagens ainda não definida','<div class="cast">'+DB.elenco.map(n=>'<div class="card person"><div class="avatar">'+esc(n.nome.split(' ').map(x=>x[0]).slice(0,2).join(''))+'</div><b>'+esc(n.nome)+'</b><div class="meta">Personagens: a definir</div><div class="meta">Esquetes: a definir</div></div>').join('')+'</div><div class="section card"><h2>Regra atual</h2><div class="sub">As esquetes são um banco de repertório. Nenhuma está vinculada a um ator para a montagem final.</div></div>')}
function esquetes(){let arr=DB.esquetes.filter(x=>(filter==='Todas'||(filter==='Inéditas'&&x.situacao==='Inédita')||(filter==='Já apresentadas'&&x.situacao.includes('Já'))||(filter==='Em avaliação'&&x.selecao==='Em avaliação do diretor'))&&x.titulo.toLowerCase().includes(query.toLowerCase()));shell('Banco de Esquetes',DB.esquetes.length+' opções de repertório','<input class="search" placeholder="Buscar esquete..." value="'+esc(query)+'" oninput="query=this.value;render()"><div class="filters">'+['Todas','Inéditas','Já apresentadas','Em avaliação'].map(f=>'<button class="filter '+(filter===f?'active':'')+'" onclick="filter=\''+f+'\';render()">'+f+'</button>').join('')+'</div><div class="cards">'+arr.map(x=>'<div class="card sketch"><h3>'+x.numero+'. '+esc(x.titulo)+'</h3><div class="meta">Origem: '+esc(x.responsavel_origem||'Não informado')+'</div><span class="badge">'+esc(x.situacao)+'</span>'+(x.selecao==='Em avaliação do diretor'?'<div class="badge review">★ Em avaliação do diretor</div>':'')+'<div style="margin-top:12px">'+(podeSelecionar()?'<button class="filter" onclick="toggleSelect(\''+x.id+'\')">'+(x.selecao==='Selecionada'?'✓ Selecionada':'Selecionar')+'</button>':'<span class="meta">A seleção do repertório é restrita ao diretor.</span>')+'</div></div>').join('')+'</div>')}
async function toggleSelect(id){if(!user)return login();const row=DB.esquetes.find(x=>x.id===id);if(!row)return;const novo=row.selecao==='Selecionada'?'Não selecionada':'Selecionada';const r=await sbClient.from('esquetes').update({selecao:novo}).eq('id',id);if(r.error)alert('Não foi possível salvar: '+r.error.message);else await load()}
function espetaculo(){const selected=DB.esquetes.filter(x=>x.selecao==='Selecionada');shell('Espetáculo','Repertório efetivamente selecionado para a montagem',selected.length?'<div class="notice">'+selected.length+' esquete(s) selecionada(s).</div><div class="cards">'+selected.map((x,i)=>'<div class="card sketch"><h3>'+String(i+1).padStart(2,'0')+' · '+esc(x.titulo)+'</h3><div class="meta">Origem: '+esc(x.responsavel_origem||'Não informado')+'</div></div>').join('')+'</div>':'<div class="empty">Nenhuma esquete foi selecionada ainda.</div>')}
function ensaios(){shell('Ensaios','Calendário e acompanhamento dos ensaios',DB.ensaios.length?DB.ensaios.map(x=>'<div class="card" style="margin-bottom:10px"><b>'+esc(x.titulo)+'</b><div class="meta">'+(x.data_hora?new Date(x.data_hora).toLocaleString('pt-BR'):'Data a definir')+' · '+esc(x.local||'Local a definir')+'</div><div class="meta">'+esc(x.status)+'</div></div>').join(''):'<div class="empty">Nenhum ensaio cadastrado ainda.</div>')}
function producao(){const statuses=['A fazer','Em andamento','Concluído'];shell('Produção','Acompanhamento das tarefas da montagem','<div class="kanban">'+statuses.map(st=>'<div class="col"><h3>'+st+'</h3>'+(DB.tarefas.filter(x=>x.status===st).map(x=>'<div class="item">'+esc(x.titulo)+'</div>').join('')||'<div class="empty">Nenhuma</div>')+'</div>').join('')+'</div>')}
function funcoesDaPessoa(pid){return DB.perfilFuncoes.filter(x=>x.perfil_id===pid).map(x=>DB.funcoes.find(f=>f.id===x.funcao_id)).filter(Boolean)}
function equipe(){if(!podeGerenciarEquipe())return shell('Equipe e Acessos','Área restrita ao Diretor','<div class="notice">Somente o Diretor pode administrar funções e acessos.</div>');const rows=DB.perfis.map(p=>{const fs=funcoesDaPessoa(p.id);return '<div class="card" style="margin-bottom:12px"><h3 style="margin:0 0 5px">'+esc(p.nome||'Usuário')+'</h3><div class="meta">'+esc(p.papel||'pendente')+' · '+(p.ativo?'Ativo':'Inativo')+'</div><div style="margin-top:10px">'+(fs.length?fs.map(f=>'<span class="badge">'+esc(f.nome)+'</span>').join(' '):'<span class="meta">Nenhuma função atribuída</span>')+'</div><button class="filter" style="margin-top:10px" onclick="adicionarFuncaoPrompt(\''+p.id+'\')">+ Adicionar função</button></div>'}).join('');shell('Equipe e Acessos','O Diretor define uma ou várias funções por pessoa',rows||'<div class="empty">Nenhum perfil cadastrado.</div>')}
async function adicionarFuncaoPrompt(pid){const op=DB.funcoes.map((f,i)=>(i+1)+'. '+f.nome).join('\\n');const n=prompt('Digite o número da função a adicionar:\\n\\n'+op);if(!n)return;const f=DB.funcoes[Number(n)-1];if(!f)return alert('Função inválida.');const r=await sbClient.rpc('adicionar_funcao',{usuario_id:pid,funcao_nome:f.nome,principal_flag:false});if(r.error)return alert(r.error.message);await load()}
function generic(t,s,b){shell(t,s,b)}
let loginCooldownUntil=0;async function login(){const now=Date.now();if(now<loginCooldownUntil){const sec=Math.ceil((loginCooldownUntil-now)/1000);alert('Aguarde '+sec+' segundos antes de solicitar outro link.');return}const email=prompt('Digite seu e-mail para receber o link de acesso:');if(!email)return;const r=await sbClient.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.href}});if(r.error){if((r.error.message||'').toLowerCase().includes('rate limit')){loginCooldownUntil=Date.now()+60000;alert('O envio de e-mail atingiu o limite temporário do Supabase. Não faça novas tentativas agora. Aguarde o limite ser liberado e use o último link recebido.')}else alert(r.error.message)}else{loginCooldownUntil=Date.now()+60000;alert('Link enviado. Verifique seu e-mail. Não solicite outro link antes de 60 segundos.')}}
async function logout(){await sbClient.auth.signOut();await load()}
sbClient.auth.onAuthStateChange(()=>load());nav();load();</script>
</body></html>
