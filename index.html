nt-size:12px}.filter.active{background:var(--pink);color:#fff;border-color:var(--pink)}.search{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.sketch h3{margin:0 0 9px;font-size:15px}.meta{font-size:12px;color:var(--muted);margin:4px 0}.badge{display:inline-block;font-size:11px;border-radius:999px;padding:5px 8px;background:#f2ecef;margin-top:7px}.review{background:var(--yellow)}.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.person{text-align:center}.avatar{width:76px;height:76px;border-radius:50%;background:#f6d5e2;color:#9e1648;display:grid;place-items:center;margin:0 auto 9px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person b{font-size:13px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:#eee8eb;border-radius:14px;padding:12px;min-height:230px}.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:4px 5px 12px}.item{background:#fff;padding:12px;border-radius:10px;margin-bottom:8px;font-size:13px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:11px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted)}.notice{padding:13px 15px;border-radius:10px;background:#fce8ef;color:#7f173e;font-size:13px;margin-bottom:15px}@media(max-width:900px){.side{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.two,.cards,.kanban{grid-template-columns:1fr}.cast{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{position:relative;width:100%;height:auto}.nav{display:flex;overflow:auto;margin-top:18px}.nav button{white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:1fr 1fr}.title{font-size:26px}}
.modal{position:fixed;inset:0;background:#211d2299;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0004}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.modalhead h2{margin:0}.close{border:0;background:#f2ecef;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}.field textarea{min-height:90px;resize:vertical}.checklist{border:1px solid var(--line);border-radius:12px;padding:8px;max-height:220px;overflow:auto}.checkrow{display:flex;align-items:center;gap:9px;padding:9px 7px;border-bottom:1px solid var(--line);font-size:13px}.checkrow:last-child{border-bottom:0}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:650px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://tatcgvmdozofxhxribdn.supabase.co';
const SUPABASE_KEY='sb_publishable_Q_OSMySEc1JZaLf5kxGsZA_31mfCKas';
const sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let DB={elenco:[],esquetes:[],ensaios:[],ficha:[],tarefas:[],atribuicoes:[],ensaioEsquetes:[],perfil:null,funcoes:[],perfilFuncoes:[],perfis:[]},page='inicio',filter='Todas',query='',user=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const navItems=[['inicio','Início'],['elenco','Elenco'],['esquetes','Banco de Esquetes'],['espetaculo','Espetáculo'],['ensaios','Ensaios'],['producao','Produção'],['divulgacao','Divulgação'],['orcamento','Orçamento'],['ficha','Ficha Técnica']];
function nav(){document.querySelector('#nav').innerHTML=navItems.map(x=>'<button class="'+(page===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function go(p){page=p;nav();render()}
function shell(t,s,b){document.querySelector('#main').innerHTML='<div class="top"><div><div class="eyebrow">Central de Produção</div><div class="title">'+t+'</div><div class="sub">'+s+'</div></div><button class="btn" onclick="go(\'esquetes\')">Banco de esquetes</button></div>'+b}
async function load(){const sess=await sbClient.auth.getSession();if(!sess.data.session){const anon=await sbClient.auth.signInAnonymously();if(anon.error){console.warn('Acesso anônimo não habilitado:',anon.error.message)}}const a=await Promise.all([sbClient.from('elenco').select('*').eq('ativo',true).order('nome'),sbClient.from('esquetes').select('*').order('numero'),sbClient.from('ensaios').select('*').order('data_hora',{ascending:true}),sbClient.from('tarefas_producao').select('*').order('created_at'),sbClient.from('ficha_tecnica').select('*').order('ordem').order('categoria'),sbClient.from('esquete_elenco').select('*'),sbClient.from('ensaio_esquetes').select('*')]);DB.elenco=a[0].data||[];DB.esquetes=a[1].data||[];DB.ensaios=a[2].data||[];DB.tarefas=a[3].data||[];DB.ficha=a[4].data||[];DB.atribuicoes=a[5].data||[];DB.ensaioEsquetes=a[5].data||[];const s=await sbClient.auth.getSession();user=s.data.session?s.data.session.user:null;DB.perfil=null;DB.funcoes=[];DB.perfilFuncoes=[];DB.perfis=[];if(user){let p=await sbClient.from('perfis').select('*').eq('id',user.id).maybeSingle();if(!p.data&&!p.error){await sbClient.rpc('solicitar_acesso');p=await sbClient.from('perfis').select('*').eq('id',user.id).maybeSingle()}DB.perfil=p.data||null;const f=await sbClient.from('funcoes').select('*').eq('ativo',true).order('nome');DB.funcoes=f.data||[];const pf=await sbClient.from('perfil_funcoes').select('perfil_id,funcao_id,principal');DB.perfilFuncoes=pf.data||[];if(temFuncao('Diretor')){const ps=await sbClient.from('perfis').select('*').order('created_at');DB.perfis=ps.data||[]}}render()}
function render(){if(page==='inicio')return home();if(page==='elenco')return elenco();if(page==='esquetes')return esquetes();if(page==='espetaculo')return espetaculo();if(page==='ensaios')return ensaios();if(page==='producao')return producao();if(page==='ficha')return fichaTecnica();if(page==='divulgacao')return generic('Divulgação','Planejamento de comunicação','<div class="notice">Módulo preparado para calendário de posts, responsáveis, canais e status.</div>');return generic('Orçamento','Controle financeiro da montagem','<div class="empty">Módulo financeiro preparado para receber os lançamentos da produção.</div>')}
function temFuncao(nome){if(!user)return false;const f=DB.funcoes.find(x=>x.nome===nome);return !!f&&DB.perfilFuncoes.some(x=>x.perfil_id===user.id&&x.funcao_id===f.id)}
function podeEditar(){return !!user}
function podeSelecionar(){return !!user}
function podeGerenciarEquipe(){return false}
function home(){const reviews=DB.esquetes.filter(x=>x.selecao==='Em avaliação do diretor').length,selected=DB.esquetes.filter(x=>x.selecao==='Selecionada').length,next=DB.ensaios[0];shell('Depois Não Reclama','Um espetáculo de esquetes humorísticas · Arcana Produções Artísticas','<div class="grid"><div class="stat"><b>'+DB.elenco.length+'</b><span>Elenco confirmado</span></div><div class="stat"><b>'+DB.esquetes.length+'</b><span>Esquetes no banco</span></div><div class="stat"><b>'+reviews+'</b><span>Em avaliação</span></div><div class="stat"><b>'+selected+'</b><span>Esquetes selecionadas</span></div></div><div class="section two"><div class="card"><h2>Próximas decisões</h2><div class="task">Definir repertório</div><div class="task">Definir calendário de ensaios</div><div class="task">Definir figurinos e adereços</div></div><div class="next"><div class="eyebrow" style="color:#f5a7c2">Próximo ensaio</div><h2>'+esc(next?next.titulo:'A definir')+'</h2><div class="muted">'+(next&&next.data_hora?new Date(next.data_hora).toLocaleString('pt-BR'):'Data · horário · local')+'</div><hr style="border:0;border-top:1px solid #ffffff20;margin:20px 0"><div class="muted">'+(user?'Sessão conectada':'Modo consulta. Faça login para editar dados.')+'</div></div></div><div class="section"><h2>Elenco confirmado</h2><div class="cast">'+DB.elenco.map(n=>'<div class="card person"><div class="avatar">'+(n.foto_url?'<img src="'+esc(n.foto_url)+'" alt="'+esc(n.nome)+'">':esc(n.nome.split(' ').map(x=>x[0]).slice(0,2).join('')) )+'</div><b>'+esc(n.nome)+'</b></div>').join('')+'</div></div><div class="section card"><h2>Acesso</h2>'+(user?'<div class="sub">Sistema aberto para gestão da produção. Não é necessário fazer login.</div>':'<div class="sub">Para editar o sistema, faça login.</div><button class="btn" onclick="login()">Entrar</button>')+'</div>')}
let elencoEditando=null;
function abrirModalElenco(id){
  elencoEditando=id?DB.elenco.find(x=>x.id===id):null;
  const r=elencoEditando;
  document.getElementById('elencoModal').classList.add('show');
  document.getElementById('elencoModalTitle').textContent=r?'Editar integrante':'Novo integrante';
  document.getElementById('eNome').value=r?.nome||'';
  document.getElementById('eArtistico').value=r?.nome_artistico||'';
  document.getElementById('eFuncao').value=r?.funcao||'';
  document.getElementById('eObs').value=r?.observacoes||'';document.getElementById('eFoto').value='';
}
function fecharModalElenco(){const m=document.getElementById('elencoModal');if(m)m.classList.remove('show');elencoEditando=null}
async function salvarModalElenco(){
  const nome=document.getElementById('eNome').value.trim();
  if(!nome)return alert('Informe o nome do integrante.');
  const payload={nome,nome_artistico:document.getElementById('eArtistico').value.trim(),funcao:document.getElementById('eFuncao').value.trim(),observacoes:document.getElementById('eObs').value.trim(),ativo:true};const foto=document.getElementById('eFoto').files[0];
  let r;
  if(elencoEditando) r=await sbClient.from('elenco').update(payload).eq('id',elencoEditando.id);
  else r=await sbClient.from('elenco').insert(payload);
  if(r.error)return alert('Não foi possível salvar: '+r.error.message);
  fecharModalElenco();await load();go('elenco');
}
async function alternarAtivoElenco(id,ativo){
  const p=DB.elenco.find(x=>x.id===id);if(!p)return;
  const r=await sbClient.from('elenco').update({ativo}).eq('id',id);
  if(r.error)return alert('Não foi possível atualizar: '+r.error.message);
  await load();go('elenco');
}
function elenco(){
  const lista=DB.elenco;
  shell('Elenco',lista.length+' integrante(s) ativos · personagens e distribuição podem ser definidos no Espetáculo',
    '<div style="display:flex;justify-content:flex-end;margin-bottom:15px"><button class="btn" onclick="abrirModalElenco()">+ Adicionar integrante</button></div>'+
    '<div class="cast">'+lista.map(n=>'<div class="card person"><div class="avatar">'+(n.foto_url?'<img src="'+esc(n.foto_url)+'" alt="'+esc(n.nome)+'">':esc(n.nome.split(' ').map(x=>x[0]).slice(0,2).join('')) )+'</div><b>'+esc(n.nome)+'</b>'+(n.nome_artistico?'<div class="meta">Nome artístico: '+esc(n.nome_artistico)+'</div>':'')+(n.funcao?'<div class="meta">'+esc(n.funcao)+'</div>':'')+'<div class="meta">Personagens: a definir</div><div class="meta">Esquetes: a definir</div><div style="margin-top:12px"><button class="filter" onclick="abrirModalElenco(\''+n.id+'\')">Editar</button><button class="filter" style="margin-left:6px" onclick="alternarAtivoElenco(\''+n.id+'\',false)">Inativar</button></div></div>').join('')+'</div>'+
    '<div class="section card"><h2>Regra atual</h2><div class="sub">Integrantes podem ser adicionados ou inativados. A distribuição de personagens e a participação em cada esquete continuam sendo definidas separadamente.</div></div>'+
    '<div id="elencoModal" class="modal" onclick="if(event.target===this)fecharModalElenco()"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">Equipe artística</div><h2 id="elencoModalTitle">Novo integrante</h2></div><button class="close" onclick="fecharModalElenco()">×</button></div><div class="formgrid"><div class="field full"><label>Nome completo</label><input id="eNome" placeholder="Ex.: Nome do integrante"></div><div class="field"><label>Nome artístico</label><input id="eArtistico" placeholder="Opcional"></div><div class="field"><label>Função</label><input id="eFuncao" placeholder="Ex.: Ator, atriz, direção"></div><div class="field"><label>Foto</label><input id="eFoto" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field full"><label>Observações</label><textarea id="eObs" placeholder="Informações úteis sobre o integrante..."></textarea></div></div><div class="modalactions"><button class="filter" onclick="fecharModalElenco()">Cancelar</button><button class="btn" onclick="salvarModalElenco()">Salvar integrante</button></div></div></div>');
}
function esquetes(){let arr=DB.esquetes.filter(x=>(filter==='Todas'||(filter==='Inéditas'&&x.situacao==='Inédita')||(filter==='Já apresentadas'&&x.situacao.includes('Já'))||(filter==='Em avaliação'&&x.selecao==='Em avaliação do diretor'))&&x.titulo.toLowerCase().includes(query.toLowerCase()));shell('Banco de Esquetes',DB.esquetes.length+' opções de repertório','<input class="search" placeholder="Buscar esquete..." value="'+esc(query)+'" oninput="query=this.value;render()"><div class="filters">'+['Todas','Inéditas','Já apresentadas','Em avaliação'].map(f=>'<button class="filter '+(filter===f?'active':'')+'" onclick="filter=\''+f+'\';render()">'+f+'</button>').join('')+'</div><div class="cards">'+arr.map(x=>'<div class="card sketch"><h3>'+x.numero+'. '+esc(x.titulo)+'</h3><div class="meta">Origem: '+esc(x.responsavel_origem||'Não informado')+'</div><span class="badge">'+esc(x.situacao)+'</span>'+(x.selecao==='Em avaliação do diretor'?'<div class="badge review">★ Em avaliação do diretor</div>':'')+'<div style="margin-top:12px">'+(podeSelecionar()?'<button class="filter" onclick="toggleSelect(\''+x.id+'\')">'+(x.selecao==='Selecionada'?'✓ Selecionada':'Selecionar')+'</button>':'<span class="meta">A seleção do repertório é restrita ao diretor.</span>')+'<button class="filter" style="margin-left:6px" onclick="editarEsquete(\''+x.id+'\')">Editar</button><button class="filter" style="margin-left:6px" onclick="excluirEsquete(\''+x.id+'\')">Excluir</button></div></div>').join('')+'</div>')}
async function editarEsquete(id){const row=DB.esquetes.find(x=>x.id===id);if(!row)return;const titulo=prompt('Nome da esquete:',row.titulo);if(titulo===null)return;if(!titulo.trim())return alert('O nome não pode ficar vazio.');const r=await sbClient.from('esquetes').update({titulo:titulo.trim()}).eq('id',id);if(r.error)return alert('Não foi possível editar: '+r.error.message);await load()}
async function excluirEsquete(id){const row=DB.esquetes.find(x=>x.id===id);if(!row)return;if(!confirm('Excluir definitivamente a esquete "'+row.titulo+'"?\n\nEla também será retirada da grade do espetáculo e suas atribuições de elenco serão removidas.'))return;const r=await sbClient.from('esquetes').delete().eq('id',id);if(r.error)return alert('Não foi possível excluir: '+r.error.message);await load()}
async function toggleSelect(id){if(!user)return login();const row=DB.esquetes.find(x=>x.id===id);if(!row)return;const novo=row.selecao==='Selecionada'?'Não selecionada':'Selecionada';const r=await sbClient.from('esquetes').update({selecao:novo}).eq('id',id);if(r.error)alert('Não foi possível salvar: '+r.error.message);else await load()}
async function moverEsquete(id,direcao){const selected=DB.esquetes.filter(x=>x.selecao==='Selecionada').sort((a,b)=>((a.ordem||9999)-(b.ordem||9999))||(a.numero-b.numero));const i=selected.findIndex(x=>x.id===id);const j=i+direcao;if(i<0||j<0||j>=selected.length)return;const a=selected[i],b=selected[j];const ra=await sbClient.from('esquetes').update({ordem:j+1}).eq('id',a.id);if(ra.error)return alert('Não foi possível reorganizar: '+ra.error.message);const rb=await sbClient.from('esquetes').update({ordem:i+1}).eq('id',b.id);if(rb.error)return alert('Não foi possível reorganizar: '+rb.error.message);await load();go('espetaculo')}
async function retirarEsquete(id){const r=await sbClient.from('esquetes').update({selecao:'Não selecionada',ordem:null}).eq('id',id);if(r.error)return alert('Não foi possível retirar: '+r.error.message);await load();go('espetaculo')}
function abrirElencoEsquete(id){const box=document.getElementById('elenco-'+id);if(!box)return;box.style.display=box.style.display==='none'?'block':'none';box.innerHTML='<div style="font-weight:800;margin-bottom:8px">Quem faz esta esquete?</div>'+DB.elenco.map(p=>{const checked=DB.atribuicoes.some(a=>a.esquete_id===id&&a.elenco_id===p.id);return '<label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleElencoEsquete(\''+id+'\',\''+p.id+'\',this.checked)"> '+esc(p.nome)+'</label>'}).join('')+'<div class="meta" style="margin-top:8px">Você pode selecionar uma ou várias pessoas.</div>'}
async function toggleElencoEsquete(esqueteId,elencoId,marcado){if(marcado){const r=await sbClient.from('esquete_elenco').upsert({esquete_id:esqueteId,elenco_id:elencoId});if(r.error)return alert('Não foi possível salvar: '+r.error.message)}else{const r=await sbClient.from('esquete_elenco').delete().eq('esquete_id',esqueteId).eq('elenco_id',elencoId);if(r.error)return alert('Não foi possível remover: '+r.error.message)}await load();go('espetaculo')}
function espetaculo(){const selected=DB.esquetes.filter(x=>x.selecao==='Selecionada').sort((a,b)=>((a.ordem||9999)-(b.ordem||9999))||(a.numero-b.numero));shell('Espetáculo','Repertório selecionado e ordem provisória da montagem',selected.length?'<div class="notice">'+selected.length+' esquete(s) selecionada(s). Defina quem participa de cada uma e organize a ordem.</div><div>'+selected.map((x,i)=>{const nomes=DB.atribuicoes.filter(a=>a.esquete_id===x.id).map(a=>{const p=DB.elenco.find(e=>e.id===a.elenco_id);return p?p.nome:null}).filter(Boolean);return '<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;gap:14px"><div style="font-size:22px;font-weight:900;min-width:34px;text-align:center">'+String(i+1).padStart(2,'0')+'</div><div style="flex:1"><h3 style="margin:0 0 5px">'+esc(x.titulo)+'</h3><div class="meta">'+(nomes.length?'Elenco: '+esc(nomes.join(', ')):'Elenco: a definir')+'</div></div><button class="filter" onclick="moverEsquete(\''+x.id+'\',-1)" '+(i===0?'disabled':'')+'>↑</button><button class="filter" onclick="moverEsquete(\''+x.id+'\',1)" '+(i===selected.length-1?'disabled':'')+'>↓</button><button class="filter" onclick="abrirElencoEsquete(\''+x.id+'\')">Definir elenco</button><button class="filter" onclick="retirarEsquete(\''+x.id+'\')">Retirar</button></div><div id="elenco-'+x.id+'" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"></div></div>'}).join('')+'</div>':'<div class="empty">Nenhuma esquete foi selecionada ainda. Vá ao Banco de Esquetes para montar o repertório.</div>')}
function ensaios(){const lista=DB.ensaios.slice().sort((a,b)=>(a.data_hora||'9999').localeCompare(b.data_hora||'9999'));shell('Ensaios','Calendário e acompanhamento dos ensaios','<div style="margin-bottom:15px"><button class="btn" onclick="abrirModalEnsaio()">+ Novo ensaio</button></div>'+(lista.length?lista.map(x=>{const nomes=DB.ensaioEsquetes.filter(e=>e.ensaio_id===x.id).map(e=>DB.esquetes.find(s=>s.id===e.esquete_id)).filter(Boolean).map(s=>s.titulo);return '<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3 style="margin:0 0 6px">'+esc(x.titulo)+'</h3><div class="meta">'+(x.data_hora?new Date(x.data_hora).toLocaleString('pt-BR'):'Data a definir')+' · '+esc(x.local||'Local a definir')+'</div><div class="meta">Status: '+esc(x.status||'A definir')+'</div>'+(nomes.length?'<div class="meta">Esquetes: '+esc(nomes.join(', '))+'</div>':'<div class="meta">Esquetes: nenhuma selecionada</div>')+(x.observacoes?'<div style="margin-top:9px;font-size:13px">'+esc(x.observacoes)+'</div>':'')+'</div><div><button class="filter" onclick="abrirModalEnsaio(\''+x.id+'\')">Editar</button><button class="filter" style="margin-left:6px" onclick="excluirEnsaio(\''+x.id+'\')">Excluir</button></div></div></div>'}).join(''):'<div class="empty">Nenhum ensaio cadastrado ainda. Clique em “Novo ensaio” para começar.</div>')+'<div id="ensaioModal" class="modal" onclick="if(event.target===this)fecharModalEnsaio()"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">Produção</div><h2 id="ensaioModalTitle">Novo ensaio</h2></div><button class="close" onclick="fecharModalEnsaio()">×</button></div><div class="formgrid"><div class="field full"><label>Título</label><input id="fTitulo" placeholder="Ex.: Ensaio geral"></div><div class="field"><label>Data</label><input id="fData" type="date"></div><div class="field"><label>Horário</label><input id="fHora" type="time"></div><div class="field"><label>Local</label><input id="fLocal" placeholder="Ex.: Sala de ensaio"></div><div class="field"><label>Status</label><select id="fStatus"><option>Planejado</option><option>Confirmado</option><option>Realizado</option><option>Cancelado</option></select></div><div class="field full"><label>Esquetes do ensaio</label><div class="checklist" id="fEsquetes"></div></div><div class="field full"><label>Observações</label><textarea id="fObs" placeholder="Anotações, objetivos do ensaio, pendências..."></textarea></div></div><div class="modalactions"><button class="filter" onclick="fecharModalEnsaio()">Cancelar</button><button class="btn" onclick="salvarModalEnsaio()">Salvar ensaio</button></div></div></div>')}
let ensaioEditando=null;
function abrirModalEnsaio(id){ensaioEditando=id?DB.ensaios.find(x=>x.id===id):null;const r=ensaioEditando;document.getElementById('ensaioModal').classList.add('show');document.getElementById('ensaioModalTitle').textContent=r?'Editar ensaio':'Novo ensaio';document.getElementById('fTitulo').value=r?.titulo||'';document.getElementById('fLocal').value=r?.local||'';document.getElementById('fStatus').value=r?.status||'Planejado';document.getElementById('fObs').value=r?.observacoes||'';let d='',h='';if(r?.data_hora){const dt=new Date(r.data_hora);d=dt.toISOString().slice(0,10);h=dt.toTimeString().slice(0,5)}document.getElementById('fData').value=d;document.getElementById('fHora').value=h;const atuais=new Set(DB.ensaioEsquetes.filter(x=>x.ensaio_id===r?.id).map(x=>x.esquete_id));const esq=DB.esquetes.filter(x=>x.selecao==='Selecionada').sort((a,b)=>((a.ordem||9999)-(b.ordem||9999))||(a.numero-b.numero));document.getElementById('fEsquetes').innerHTML=esq.length?esq.map(x=>'<label class="checkrow"><input type="checkbox" value="'+x.id+'" '+(atuais.has(x.id)?'checked':'')+'> <span>'+String(x.ordem||x.numero).padStart(2,'0')+' · '+esc(x.titulo)+'</span></label>').join(''):'<div class="empty">Nenhuma esquete foi selecionada para o espetáculo.</div>'}
function fecharModalEnsaio(){const m=document.getElementById('ensaioModal');if(m)m.classList.remove('show');ensaioEditando=null}
async function salvarModalEnsaio(){const titulo=document.getElementById('fTitulo').value.trim();if(!titulo)return alert('Informe o título do ensaio.');const data=document.getElementById('fData').value, hora=document.getElementById('fHora').value;const payload={titulo,data_hora:data?(new Date(data+'T'+(hora||'00:00'))).toISOString():null,local:document.getElementById('fLocal').value.trim(),status:document.getElementById('fStatus').value,observacoes:document.getElementById('fObs').value.trim()};let id=ensaioEditando?.id;if(id){const r=await sbClient.from('ensaios').update(payload).eq('id',id);if(r.error)return alert('Não foi possível salvar: '+r.error.message)}else{const r=await sbClient.from('ensaios').insert(payload).select().single();if(r.error)return alert('Não foi possível criar: '+r.error.message);id=r.data.id}const ids=[...document.querySelectorAll('#fEsquetes input[type=checkbox]:checked')].map(x=>x.value);const d=await sbClient.from('ensaio_esquetes').delete().eq('ensaio_id',id);if(d.error)return alert('Não foi possível atualizar as esquetes: '+d.error.message);if(ids.length){const ins=await sbClient.from('ensaio_esquetes').insert(ids.map(esquete_id=>({ensaio_id:id,esquete_id})));if(ins.error)return alert('Não foi possível vincular as esquetes: '+ins.error.message)}fecharModalEnsaio();await load();go('ensaios')}
async function novoEnsaio(){await formularioEnsaio(null)}

async function editarEnsaio(id){await formularioEnsaio(DB.ensaios.find(x=>x.id===id))}
async function formularioEnsaio(row){const titulo=prompt('Título do ensaio:',row?row.titulo:'Ensaio');if(titulo===null)return;if(!titulo.trim())return alert('Informe um título.');const data=prompt('Data e horário (AAAA-MM-DDTHH:MM):',row&&row.data_hora?new Date(row.data_hora).toISOString().slice(0,16):'');if(data===null)return;const local=prompt('Local:',row?row.local||'':'');if(local===null)return;const status=prompt('Status (Planejado, Confirmado, Realizado, Cancelado):',row?row.status||'Planejado':'Planejado');if(status===null)return;const obs=prompt('Observações:',row?row.observacoes||'':'');if(obs===null)return;let id=row&&row.id;if(row){const r=await sbClient.from('ensaios').update({titulo:titulo.trim(),data_hora:data?new Date(data).toISOString():null,local:local.trim(),status:status.trim(),observacoes:obs.trim()}).eq('id',row.id);if(r.error)return alert('Não foi possível salvar: '+r.error.message)}else{const r=await sbClient.from('ensaios').insert({titulo:titulo.trim(),data_hora:data?new Date(data).toISOString():null,local:local.trim(),status:status.trim(),observacoes:obs.trim()}).select().single();if(r.error)return alert('Não foi possível criar: '+r.error.message);id=r.data.id}await load();await selecionarEsquetesEnsaio(id)}
async function selecionarEsquetesEnsaio(id){const atuais=DB.ensaioEsquetes.filter(x=>x.ensaio_id===id).map(x=>x.esquete_id);const selecionadas=prompt('Digite os números das esquetes, separados por vírgula.\n\n'+DB.esquetes.filter(x=>x.selecao==='Selecionada').map(x=>x.numero+'. '+x.titulo).join('\n'),atuais.map(id=>{const s=DB.esquetes.find(x=>x.id===id);return s?s.numero:''}).filter(Boolean).join(', '));if(selecionadas===null)return;const nums=selecionadas.split(',').map(x=>parseInt(x.trim(),10)).filter(Number.isFinite);const escolhidas=DB.esquetes.filter(x=>nums.includes(x.numero));const del=await sbClient.from('ensaio_esquetes').delete().eq('ensaio_id',id);if(del.error)return alert('Não foi possível atualizar as esquetes: '+del.error.message);if(escolhidas.length){const ins=await sbClient.from('ensaio_esquetes').insert(escolhidas.map(x=>({ensaio_id:id,esquete_id:x.id})));if(ins.error)return alert('Não foi possível vincular as esquetes: '+ins.error.message)}await load()}
async function excluirEnsaio(id){const row=DB.ensaios.find(x=>x.id===id);if(!row)return;if(!confirm('Excluir o ensaio "'+row.titulo+'"?'))return;const r=await sbClient.from('ensaios').delete().eq('id',id);if(r.error)return alert('Não foi possível excluir: '+r.error.message);await load()}
function producao(){const statuses=['A fazer','Em andamento','Concluído'];shell('Produção','Acompanhamento das tarefas da montagem','<div class="kanban">'+statuses.map(st=>'<div class="col"><h3>'+st+'</h3>'+(DB.tarefas.filter(x=>x.status===st).map(x=>'<div class="item">'+esc(x.titulo)+'</div>').join('')||'<div class="empty">Nenhuma</div>')+'</div>').join('')+'</div>')}
let fichaEditando=null;
function abrirModalFicha(id){fichaEditando=id?DB.ficha.find(x=>x.id===id):null;const r=fichaEditando;document.getElementById('fichaModal').classList.add('show');document.getElementById('ftCategoria').value=r?.categoria||'Direção';document.getElementById('ftFuncao').value=r?.funcao||'';document.getElementById('ftNome').value=r?.nome||'';document.getElementById('ftContato').value=r?.contato||'';document.getElementById('ftObs').value=r?.observacoes||'';document.getElementById('ftOrdem').value=r?.ordem||''}
function fecharModalFicha(){const m=document.getElementById('fichaModal');if(m)m.classList.remove('show');fichaEditando=null}
async function salvarModalFicha(){const categoria=document.getElementById('ftCategoria').value.trim(),funcao=document.getElementById('ftFuncao').value.trim(),nome=document.getElementById('ftNome').value.trim();if(!funcao||!nome)return alert('Informe a função e o nome.');const payload={categoria,funcao,nome,contato:document.getElementById('ftContato').value.trim(),observacoes:document.getElementById('ftObs').value.trim(),ordem:parseInt(document.getElementById('ftOrdem').value,10)||null};let r=fichaEditando?await sbClient.from('ficha_tecnica').update(payload).eq('id',fichaEditando.id):await sbClient.from('ficha_tecnica').insert(payload);if(r.error)return alert('Não foi possível salvar: '+r.error.message);fecharModalFicha();await load();go('ficha')}
async function excluirFicha(id){if(!confirm('Excluir este item da ficha técnica?'))return;const r=await sbClient.from('ficha_tecnica').delete().eq('id',id);if(r.error)return alert('Não foi possível excluir: '+r.error.message);await load();go('ficha')}
function fichaTecnica(){const grupos={};DB.ficha.forEach(x=>(grupos[x.categoria]??=[]).push(x));const corpo=Object.keys(grupos).length?Object.entries(grupos).map(([cat,itens])=>'<div class="section card"><h2>'+esc(cat)+'</h2><table><thead><tr><th>Função</th><th>Nome</th><th>Contato</th><th>Observações</th><th></th></tr></thead><tbody>'+itens.map(x=>'<tr><td>'+esc(x.funcao)+'</td><td><b>'+esc(x.nome)+'</b></td><td>'+esc(x.contato||'')+'</td><td>'+esc(x.observacoes||'')+'</td><td><button class="filter" onclick="abrirModalFicha(\\''+x.id+'\\')">Editar</button> <button class="filter" onclick="excluirFicha(\\''+x.id+'\\')">Excluir</button></td></tr>').join('')+'</tbody></table></div>').join(''):'<div class="empty">Nenhum profissional cadastrado na ficha técnica.</div>';shell('Ficha Técnica','Créditos e equipe profissional do espetáculo','<div style="display:flex;justify-content:flex-end;margin-bottom:15px"><button class="btn" onclick="abrirModalFicha()">+ Adicionar profissional</button></div>'+corpo+'<div id="fichaModal" class="modal" onclick="if(event.target===this)fecharModalFicha()"><div class="modalbox"><div class="modalhead"><div><div class="eyebrow">Ficha técnica</div><h2>Profissional</h2></div><button class="close" onclick="fecharModalFicha()">×</button></div><div class="formgrid"><div class="field"><label>Categoria</label><select id="ftCategoria"><option>Direção</option><option>Elenco</option><option>Produção</option><option>Direção de arte</option><option>Figurino</option><option>Adereços</option><option>Iluminação</option><option>Sonoplastia</option><option>Fotografia</option><option>Vídeo</option><option>Divulgação</option><option>Design</option><option>Financeiro</option><option>Outros</option></select></div><div class="field"><label>Função</label><input id="ftFuncao" placeholder="Ex.: Direção geral"></div><div class="field full"><label>Nome</label><input id="ftNome" placeholder="Nome do profissional"></div><div class="field"><label>Contato</label><input id="ftContato" placeholder="Telefone, e-mail ou @"></div><div class="field"><label>Ordem</label><input id="ftOrdem" type="number" min="1" placeholder="Opcional"></div><div class="field full"><label>Observações</label><textarea id="ftObs" placeholder="Informações adicionais..."></textarea></div></div><div class="modalactions"><button class="filter" onclick="fecharModalFicha()">Cancelar</button><button class="btn" onclick="salvarModalFicha()">Salvar</button></div></div></div>')}
function funcoesDaPessoa(pid){return DB.perfilFuncoes.filter(x=>x.perfil_id===pid).map(x=>DB.funcoes.find(f=>f.id===x.funcao_id)).filter(Boolean)}
 function generic(t,s,b){shell(t,s,b)}
let loginCooldownUntil=0;

nav();load();</script>
</body></html>
