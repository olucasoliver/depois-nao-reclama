async function load(){if(carregando)return carregando;carregando=carregar().finally(()=>{carregando=null});return carregando}
async function carregar(){const s=await sbClient.auth.getSession();user=s.data.session?s.data.session.user:null;
if(user&&user.is_anonymous){await sbClient.auth.signOut();user=null}
usuarioCarregado=user?user.id:null;acessoLiberado=false;DB.perfil=null;DB.funcoes=[];DB.perfilFuncoes=[];DB.perfis=[];

const [f,pf]=await Promise.all([sbClient.from('funcoes').select('*').eq('ativo',true).order('nome'),sbClient.from('perfil_funcoes').select('perfil_id,funcao_id,principal')]);
DB.funcoes=f.data||[];DB.perfilFuncoes=pf.data||[];acessoLiberado=true;

DB.elenco=a[0].data||[];DB.esquetes=a[1].data||[];DB.ensaios=a[2].data||[];DB.tarefas=a[3].data||[];DB.ficha=a[4].data||[];DB.divulgacao=a[5].data||[];DB.orcamento=a[6].data||[];DB.checklist=a[7].data||[];DB.atribuicoes=a[8].data||[];DB.ensaioEsquetes=a[9].data||[];DB.sessoes=a[10].data||[];DB.personagens=a[11].data||[];DB.itens=a[12].data||[];DB.perfis=a[13].data||[];DB.presencas=a[14].data||[];DB.aprovacoes=a[15].data||[];
if(page!=='conta'&&page!=='esquete'&&page!=='ensaio'&&!navPermitido().some(x=>x[0]===page))page='inicio';
aplicarPermissoes();nav();render()}

function render(){if(page==='inicio')return home();if(page==='elenco')return elenco();if(page==='esquetes')return esquetes();if(page==='espetaculo')return espetaculo();if(page==='ensaios')return ensaios();if(page==='producao')return producao();if(page==='ficha')return fichaTecnica();if(page==='divulgacao')return divulgacao();if(page==='orcamento')return orcamento();if(page==='checklist')return checklist();if(page==='equipe')return equipe();if(page==='conta')return minhaConta();if(page==='esquete')return esqueteDetalhe();if(page==='ensaio')return ensaioDetalhe();if(page==='roteiro')return roteiro();if(page==='aprovacoes')return aprovacoes();return generic('Orçamento','Controle financeiro da montagem','<div class="empty">Módulo financeiro preparado para receber os lançamentos da produção.</div>')}

function temFuncao(nome){if(!user)return false;const f=DB.funcoes.find(x=>x.nome===nome);return !!f&&DB.perfilFuncoes.some(x=>x.perfil_id===user.id&&x.funcao_id===f.id)}

function dataLocalISO(dt){const p=n=>String(n).padStart(2,'0');return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())}
function buscarEsquete(valor){query=valor;render();const i=document.getElementById('buscaEsquete');if(i){i.focus();i.setSelectionRange(valor.length,valor.length)}}

let elencoEditando=null;
function abrirModalElenco(id){
  elencoEditando=id?DB.elenco.find(x=>x.id===id):null;
  const r=elencoEditando;
  document.getElementById('elencoModal').classList.add('show');
  document.getElementById('elencoModalTitle').textContent=r?'Editar integrante':'Novo integrante';
  document.getElementById('eNome').value=r?.nome||'';
  document.getElementById('eArtistico').value=r?.nome_artistico||'';
  document.getElementById('eFuncao').value=r?.funcao||'';
  document.getElementById('ePerfil').innerHTML=opcoesContas(r?.perfil_id);
  document.getElementById('eObs').value=r?.observacoes||'';document.getElementById('eFoto').value='';
}
function fecharModalElenco(){const m=document.getElementById('elencoModal');if(m)m.classList.remove('show');elencoEditando=null}
async function salvarModalElenco(){
  const nome=document.getElementById('eNome').value.trim();
  if(!nome)return alert('Informe o nome do integrante.');

  const payload={
    nome,
    nome_artistico:document.getElementById('eArtistico').value.trim(),
    funcao:document.getElementById('eFuncao').value.trim(),
    perfil_id:document.getElementById('ePerfil').value||null,
    observacoes:document.getElementById('eObs').value.trim(),
    ativo:true
  };

  const foto=document.getElementById('eFoto').files[0];

  if(foto){
    if(!['image/jpeg','image/png','image/webp'].includes(foto.type)){
      return alert('A foto precisa ser JPG, PNG ou WEBP.');
    }
    if(foto.size>5*1024*1024){
      return alert('A foto deve ter no máximo 5 MB.');
    }

    const ext=(foto.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path=(elencoEditando?.id||crypto.randomUUID())+'/'+Date.now()+'.'+ext;
    const upload=await sbClient.storage.from('elenco-fotos').upload(path,foto,{contentType:foto.type,upsert:true});
    if(upload.error)return alert('Não foi possível enviar a foto: '+upload.error.message);

    const publicUrl=sbClient.storage.from('elenco-fotos').getPublicUrl(path).data.publicUrl;
    payload.foto_url=publicUrl;
  }

  let r;
  if(elencoEditando) r=await sbClient.from('elenco').update(payload).eq('id',elencoEditando.id);
  else r=await sbClient.from('elenco').insert(payload);

  if(r.error)return alert('Não foi possível salvar o integrante: '+r.error.message);
  fecharModalElenco();
  await load();
  go('elenco');
}

  const p=DB.elenco.find(x=>x.id===id);if(!p)return;
  const r=await sbClient.from('elenco').update({ativo}).eq('id',id);
  if(r.error)return alert('Não foi possível atualizar: '+r.error.message);
  await load();go('elenco');
}

}

async function salvarChecklist(){const item=document.getElementById('cItem').value.trim();if(!item)return alert('Informe o item.');const payload={item,categoria:document.getElementById('cCategoria').value.trim(),responsavel:document.getElementById('cResponsavel').value.trim(),prazo:document.getElementById('cPrazo').value||null,concluido:document.getElementById('cConcluido').value==='true'};const r=checklistEditando?await sbClient.from('checklist').update(payload).eq('id',checklistEditando.id):await sbClient.from('checklist').insert(payload);if(r.error)return alert('Não foi possível salvar: '+r.error.message);fecharChecklist();await load();go('checklist')}
async function alternarChecklist(id,concluido){const r=await sbClient.from('checklist').update({concluido}).eq('id',id);if(r.error)return alert('Não foi possível atualizar: '+r.error.message);await load();go('checklist')}
async function excluirChecklist(id){if(!await confirmar('Excluir este item do checklist?'))return;const r=await sbClient.from('checklist').delete().eq('id',id);if(r.error)return alert('Não foi possível excluir: '+r.error.message);await load();go('checklist')}
function funcoesDaPessoa(pid){return DB.perfilFuncoes.filter(x=>x.perfil_id===pid).map(x=>DB.funcoes.find(f=>f.id===x.funcao_id)).filter(Boolean)}
